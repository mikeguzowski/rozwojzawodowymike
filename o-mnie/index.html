    function enhanceWorkshop() {
      const workshop = document.querySelector("#warsztat-spotkanie");
      if (!workshop) return;
      const repeatedWorkshopLabel = [...workshop.querySelectorAll(".section-heading > .eyebrow")].find((label) => label.textContent.trim() === "Warsztat");
      if (repeatedWorkshopLabel) repeatedWorkshopLabel.remove();
      const achievementsHeading = [...workshop.querySelectorAll(".section-heading > p")].find((paragraph) => paragraph.textContent.includes("Moje osiągnięcia"));
      if (achievementsHeading) achievementsHeading.classList.add("achievements-heading");
      const flowParagraphs = [...workshop.querySelectorAll(".section-heading > p")].filter((paragraph) => paragraph.textContent.includes("➡️"));
      flowParagraphs.forEach((paragraph) => {
        const [label, ...steps] = paragraph.textContent.split(":");
        const nodes = steps.join(":").split("➡️").map((step) => step.trim()).filter(Boolean);
        const block = document.createElement("div");
        block.className = "flow-block";
        block.innerHTML = `<p class="flow-label">${label.trim()}</p><div class="flow-diagram">${nodes.map((node, index) => `<span class="flow-node">${node}</span>${index < nodes.length - 1 ? '<span class="flow-arrow" aria-hidden="true">→</span>' : ""}`).join("")}</div>`;
        paragraph.replaceWith(block);
      });
      workshop.querySelectorAll(".panel li").forEach((item) => {
        const match = item.textContent.trim().match(/^\(([^)]+)\)\s*(.*)$/);
        if (!match) return;
        item.textContent = "";
        const label = document.createElement("span");
        label.className = "achievement-label";
        label.textContent = match[1];
        const description = document.createElement("span");
        description.textContent = match[2];
        item.append(label, description);
      });
    }
    function reorderPersonalMeeting() {
      const workshop = document.querySelector("#warsztat-spotkanie");
      if (!workshop || document.querySelector("#cases-reordered")) return;
      const casesHeading = workshop.querySelector("#cases");
      if (!casesHeading) return;
      const cases = [];
      let next = casesHeading.nextElementSibling;
      while (next && next.classList.contains("case")) {
        const current = next;
        next = next.nextElementSibling;
        cases.push(current);
      }
      if (!cases.length) return;
      const section = document.createElement("section");
      section.className = "section case-studies-section";
      section.id = "cases-reordered";
      const wrap = document.createElement("div");
      wrap.className = "wrap";
      wrap.append(casesHeading, ...cases);
      section.append(wrap);
      workshop.parentElement.insertBefore(section, workshop);
    }

      <section class="section" id="warsztat"><div class="wrap"><div class="section-heading"><p class="eyebrow">MÓJ WARSZTAT</p><h2>Doświadczenie i narzędzia</h2><p>Mój warsztat budowałem na drodze wielu lat doświadczeń zaczynając jako programista (Predica), konsultant procesów biznesowych (Findwise), lider IT (PwC), przedsiębiorca (m.in. Developico), mentor (m.in. Politechnika Warszawska).</p><p>Korzystam z doświadczeń, technik i narzędzi - zależnie od potrzeb i okoliczności. Zobacz 5 przykładów, gdzie opisuję kontekst, narzędzie z jakiego skorzystałem i rezultat.</p></div><div class="panel"><p><strong>Ostatnie 10 lat istotnie wzbogaciły moje doświadczenie:</strong></p><ul class="clean-list"><li>Zbudowałem firmę z 4 mln rocznego obrotu</li><li>3-krotnie otrzymałem tytuł Microsoft MVP (m.in. za ponad 100+ wystąpień publicznych)</li><li>Ukończyłem ½ Iron Man w czasie poniżej 5h</li><li>Zbudowałem kilka personal brandów (nie ze wszystkich jestem dumny)</li><li>Pomagam prowadzić kawiarnię od strony IT i odpowiadając za strategię cenową</li><li>Utworzyłem autorski kierunek na Politechnice Warszawskiej</li><li>Zorganizowałem 3 edycje największej konferencji No Code, która przyciągnęła łącznie 1000 osób</li></ul></div><h2 id="cases" style="margin-top:52px">Realne przykłady współpracy</h2><div class="case"><h3>Case 1. „Czy naprawdę chcę zmienić pracę?”</h3><p>Doświadczony specjalista był przekonany, że potrzebuje zmiany pracy. Skorzystaliśmy z matrycy Mam/Chcę oraz modelu ABCDE i odkryliśmy, że problemem nie była sama firma, ale konkretne elementy obecnej roli. Zamiast od razu składać wypowiedzenie, przygotowaliśmy rozmowę z przełożonym.</p></div><div class="case"><h3>Case 2. Manager czy ekspert?</h3><p>Senior dostał możliwość wejścia w rolę managerską. Wykorzystaliśmy matrycę Mam/Chcę oraz okno Johari, oddzielając prestiż i oczekiwania otoczenia od tego, jak naprawdę chce pracować. Zaplanował mały eksperyment przed trwałą zmianą roli.</p></div><div class="case"><h3>Case 3. Mam pomysł na biznes. Czy rzucać etat?</h3><p>Skorzystaliśmy z pętli OODA oraz analizy ROI-Driven. Zamiast odpowiadać „czy biznes wypali?”, zamieniliśmy niewiadome na hipotezy do sprawdzenia i prosty plan walidacji.</p></div><div class="case"><h3>Case 4. Firma działa, ale founder nie wie, co dalej</h3><p>Porównaliśmy kierunki rozwoju według kilku kryteriów, korzystając z Lean Canvas oraz analizy SWOT, nazwaliśmy koszt alternatywny i wybraliśmy jeden eksperyment biznesowy na najbliższy okres.</p></div><div class="case"><h3>Case 5. „Muszę się lepiej zorganizować”</h3><p>Manager miał więcej zobowiązań, niż był w stanie realnie obsłużyć. Wykonaliśmy Koło Życia, a następnie używając matrycy Effort/Value wybraliśmy, z czego zrezygnować, co oddelegować i gdzie postawić granice.</p></div></div></section>

yliśmy obie ścieżki na konsekwencje, ryzyka i możliwości. Zamiast podejmować decyzję na podstawie wyobrażeń, zaplanował mały eksperyment pozwalający sprawdzić część obowiązków managerskich przed trwałą zmianą roli.</p></div><div class="case"><h3>Case 3. Mam pomysł na biznes. Czy rzucać etat?</h3><p>Specjalista od miesięcy myślał o własnej firmie. Im więcej analizował, tym więcej znajdował argumentów zarówno za, jak i przeciw. Skorzystaliśmy z pętli OODA oraz wsparliśmy to analizą ROI-Driven. Zamiast próbować odpowiedzieć na pytanie „czy biznes wypali?”, zamieniliśmy niewiadome na hipotezy, które można sprawdzić. Na koniec wykorzystując model SMART(ER) powstał prosty plan walidacji: pierwsza oferta, rozmowy z potencjalnymi klientami i kryteria określające, kiedy dalsze inwestowanie czasu ma sens.</p></div><div class="case"><h3>Case 4. Firma działa, ale founder nie wie, co dalej</h3><p>Przedsiębiorca miał kilka możliwych kierunków rozwoju firmy. Każdy wydawał się sensowny, więc wszystkie były rozwijane jednocześnie. Problemem nie był brak pomysłów. Problemem była niechęć do rezygnacji z któregokolwiek z nich. Porównaliśmy kierunki według kilku kryteriów, korzystając z modelu Lean Canvas oraz analizy SWOT, nazwaliśmy koszt alternatywny i wybraliśmy jeden eksperyment biznesowy na najbliższy okres. Pozostałe pomysły świadomie trafiły na później.</p></div><div class="case"><h3>Case 5. „Muszę się lepiej zorganizować”</h3><p>Manager przyszedł z problemem produktywności. Miał za dużo tematów, ciągle coś odkładał i szukał kolejnego sposobu organizacji pracy. Faktycznie miał więcej zobowiązań, niż był w stanie realnie obsłużyć. Wyraźnie zobaczyliśmy to wykonując Koło Życia, a następnie używając matrycy Effort/Value, wybraliśmy te obszary z których warto zrezygnować, co oddelegować, a gdzie postawić granice.</p></div></div></section>
